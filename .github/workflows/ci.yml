name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build --no-sources --out-dir dist/release
      - name: Check release contents
        run: uv run --locked python tools/check_release.py dist/release
      - name: Test installed wheel in isolation
        shell: bash
        run: >-
          uv run --isolated --no-project --python '${{ matrix.python-version }}'
          --with dist/release/*.whl --with 'pytest>=8,<10'
          python -c "import pathlib,sys,ttx,kardx,pytest;
          source=(pathlib.Path.cwd()/'src').resolve();
          assert all(not pathlib.Path(module.__file__).resolve().is_relative_to(source) for module in (ttx,kardx));
          sys.exit(pytest.main(['tests','-q']))"
